name: Publish adapter to npm

# Publishes @digital-defiance/ghdash-pages when a tag named adapter-v<version> is pushed.
# The tag must match the version in ghpages-port/adapter/package.json.
# Needs a repository secret NPM_TOKEN (an npm automation token with publish rights to the @digital-defiance scope).

on:
  push:
    tags: ["adapter-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ghpages-port/adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: The tag must match the package version
        run: |
          version=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "adapter-v${version}" ] || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
