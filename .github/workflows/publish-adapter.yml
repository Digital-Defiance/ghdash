name: Publish adapter to npm

# Publishes @digitaldefiance/gitdash-pages when a tag named adapter-v<version> is pushed.
# The tag must match the version in gitpages-port/adapter/package.json.
#
# Uses npm trusted publishing, so there is no npm token. On npmjs.com, open the package's
# Settings, then Trusted Publisher, choose GitHub Actions and enter organization
# "Digital-Defiance", repository "gitdash" and workflow filename "publish-adapter.yml".
# The package has to exist first, so publish the first version by hand (see gitpages-port/adapter/README.md).

on:
  push:
    tags: ["adapter-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitpages-port/adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Trusted publishing needs npm 11.5.1 or later
        run: npm install -g npm@^11.5.1
      - name: The tag must match the package version
        run: |
          version=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "adapter-v${version}" ] || { echo "tag ${GITHUB_REF_NAME} does not match version ${version}"; exit 1; }
      - run: npm test
      - run: npm publish --access public
