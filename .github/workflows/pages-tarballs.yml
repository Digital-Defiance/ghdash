name: Publish Pages tarballs

# Builds the packages that the GitHub Pages port changes and attaches their npm
# tarballs to a GitHub release, so sites such as GHDash-example can depend on a
# release URL instead of vendoring binaries.
#
# Run it from the Actions tab (workflow_dispatch) with a tag name, or push a tag
# that starts with `pages-v`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update, for example pages-v0.1.0
        required: true
  push:
    tags: ["pages-v*"]

permissions:
  contents: write

concurrency:
  group: pages-tarballs
  cancel-in-progress: false

jobs:
  tarballs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack
        run: |
          mkdir -p out
          for p in admin core; do
            (cd packages/$p && pnpm pack --pack-destination "$GITHUB_WORKSPACE/out")
          done
          ls -la out
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.tgz --clobber
          else
            gh release create "$TAG" out/*.tgz \
              --title "$TAG" \
              --notes "Tarballs for the GitHub Pages port. Install with an npm override pointing at the asset URL." \
              --target "${GITHUB_SHA}"
          fi
